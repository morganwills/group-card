# The site is the repository root — there is nothing to build.
# This file exists so Netlify does not ask, and does not guess.

[build]
  publish = "."
  command = ""

# config.js carries the board's wording and endpoints. Without this,
# an edit to it can sit behind a stale cache after a deploy.
[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
